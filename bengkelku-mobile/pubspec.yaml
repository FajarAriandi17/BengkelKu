name: bengkelku
description: BengkelKu — marketplace bengkel motor (booking, bengkel terdekat GPS, pengingat oli).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Supabase
  supabase_flutter: ^2.5.6

  # Peta & lokasi
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # Media & kamera (unggah ≤ 2 MB)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Notifikasi
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Util
  intl: ^0.20.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  url_launcher: ^6.3.0
  uuid: ^4.4.0

  # Error
  sentry_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/illustrations/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
